name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test application and Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Backend and browser tests
        run: |
          npm test
          npm run test:ui
      - name: Build local test image
        run: docker build --tag pettertech-ci:test .
      - name: Smoke-test actual container
        run: |
          docker run --rm --read-only --memory=256m --cpus=0.5 \
            --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD/test/container-smoke.mjs:/app/test/container-smoke.mjs:ro" \
            pettertech-ci:test node test/container-smoke.mjs
      - name: Smoke-test default container listener
        run: |
          container_name=pettertech-ci-default
          trap 'docker stop "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name "$container_name" \
            --read-only --memory=256m --cpus=0.5 \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 127.0.0.1::80 pettertech-ci:test
          host_port="$(docker port "$container_name" 80/tcp | sed 's/.*://')"
          for attempt in $(seq 1 30); do
            if [ "$(curl --fail --silent --max-time 1 "http://127.0.0.1:${host_port}/healthz" 2>/dev/null)" = '{"status":"ok"}' ]; then
              echo "Default container command served /healthz on port 80."
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -q true; then
              docker logs "$container_name" || true
              echo "Default container command exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          docker logs "$container_name" || true
          echo "Default container command did not serve /healthz within 30 seconds."
          exit 1

  publish:
    name: Publish AMD64 and ARM64 to GHCR
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive image name and validate release version
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'Use a version tag such as v1.0.0 (no prerelease suffix).'
            exit 1
          fi
          printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          build-args: |
            DEMO_VERSION=${{ steps.image.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=PetterTech Live Container
            org.opencontainers.image.description=Branded live container demo with animated graphics and real runtime data
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show image reference and first-time visibility reminder
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Published container\n\n'
            printf '%s:%s\n\n' "$IMAGE_NAME" "$VERSION"
            printf 'Digest-pinned reference: %s@%s\n\n' "$IMAGE_NAME" "$DIGEST"
            printf 'Platforms: linux/amd64 and linux/arm64.\n\n'
            printf '**First publish:** go to your GitHub profile → Packages → this image → Package settings → Change visibility → Public.\n\n'
            printf 'A public repository does not automatically make the container public.\n'
          } >> "$GITHUB_STEP_SUMMARY"
